<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Management Dashboard</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 0;
      min-height: 100%;
      color: #2d3748;
    }

    html {
      height: 100%;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 2rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .header h1 {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-text {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      color: #64748b;
      font-weight: 400;
    }

    .main-container {
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: white;
      margin-bottom: 1.5rem;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #667eea, #764ba2);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-icon {
      width: 24px;
      height: 24px;
      fill: #667eea;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.5rem;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s ease;
      background: white;
      box-sizing: border-box;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
      margin: 0;
    }

    button {
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 0.5rem;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .hostel-display {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hostel-item {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: #f8fafc;
      border-radius: 12px;
      border-left: 4px solid #667eea;
    }

    .hostel-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.5rem;
    }

    .hostel-address {
      color: #64748b;
      margin-bottom: 1rem;
    }

    .building-item {
      margin: 1rem 0;
      padding: 1rem;
      background: white;
      border-radius: 8px;
      border-left: 3px solid #764ba2;
    }

    .building-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 0.5rem;
    }

    .floor-item {
      margin: 0.75rem 0;
      padding: 0.75rem;
      background: #f1f5f9;
      border-radius: 6px;
      border-left: 2px solid #94a3b8;
    }

    .room-item {
      margin: 0.5rem 0;
      padding: 0.5rem;
      background: white;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
    }

    .beds-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .bed {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .bed.vacant {
      background: #dcfce7;
      border-left: 4px solid #22c55e;
      color: #166534;
    }

    .bed.occupied {
      background: #fee2e2;
      border-left: 4px solid #ef4444;
      color: #991b1b;
    }

    .bed-actions {
      display: flex;
      gap: 0.25rem;
    }

    .bed-actions button {
      width: auto;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      margin: 0;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .status-vacant {
      background: #dcfce7;
      color: #166534;
    }

    .status-occupied {
      background: #fee2e2;
      color: #991b1b;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #64748b;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
      
      .header h1 {
        font-size: 2rem;
      }
      
      .main-container {
        padding: 1rem;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <header class="header">
   <h1 id="dashboard-title">Hostel Management Dashboard</h1>
   <p class="welcome-text" id="welcome-message">Manage your hostels, buildings, floors, rooms, and beds efficiently</p>
  </header>
  <main class="main-container">
   <div class="section-title">
    Add New Items
   </div>
   <div class="cards-grid"><!-- Add Hostel Form -->
    <div class="card">
     <div class="card-title">
      <svg class="card-icon" viewbox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg> Add Hostel
     </div>
     <div class="form-group"><label class="form-label" for="hostel-name">Hostel Name</label> <input type="text" id="hostel-name" placeholder="Enter hostel name">
     </div>
     <div class="form-group"><label class="form-label" for="hostel-address">Hostel Address</label> <input type="text" id="hostel-address" placeholder="Enter hostel address">
     </div><button onclick="addHostel()">Add Hostel</button>
    </div><!-- Add Building Form -->
    <div class="card">
     <div class="card-title">
      <svg class="card-icon" viewbox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z" />
      </svg> Add Building
     </div>
     <div class="form-group"><label class="form-label" for="building-hostel">Select Hostel</label> <select id="building-hostel"> <option value="">Choose a hostel</option> </select>
     </div>
     <div class="form-group"><label class="form-label" for="building-name">Building Name</label> <input type="text" id="building-name" placeholder="Enter building name">
     </div><button onclick="addBuilding()">Add Building</button>
    </div><!-- Add Floor Form -->
    <div class="card">
     <div class="card-title">
      <svg class="card-icon" viewbox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
      </svg> Add Floor
     </div>
     <div class="form-group"><label class="form-label" for="floor-building">Select Building</label> <select id="floor-building"> <option value="">Choose a building</option> </select>
     </div>
     <div class="form-group"><label class="form-label" for="floor-name">Floor Name</label> <input type="text" id="floor-name" placeholder="Enter floor name">
     </div><button onclick="addFloor()">Add Floor</button>
    </div><!-- Add Room Form -->
    <div class="card">
     <div class="card-title">
      <svg class="card-icon" viewbox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" />
      </svg> Add Room
     </div>
     <div class="form-group"><label class="form-label" for="room-floor">Select Floor</label> <select id="room-floor"> <option value="">Choose a floor</option> </select>
     </div>
     <div class="form-group"><label class="form-label" for="room-number">Room Number</label> <input type="text" id="room-number" placeholder="Enter room number">
     </div>
     <div class="form-group"><label class="form-label" for="room-total-beds">Total Beds</label> <input type="number" id="room-total-beds" placeholder="Enter number of beds" min="1">
     </div><button onclick="addRoom()">Add Room</button>
    </div><!-- Add Bed Form -->
    <div class="card">
     <div class="card-title">
      <svg class="card-icon" viewbox="0 0 24 24"><path d="M7 14c1.66 0 3-1.34 3-3S8.66 8 7 8s-3 1.34-3 3 1.34 3 3 3zm0-4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM19 7h-8v7H3V6c0-.55-.45-1-1-1s-1 .45-1 1v11c0 .55.45 1 1 1s1-.45 1-1v-2h18v2c0 .55.45 1 1 1s1-.45 1-1V10c0-1.65-1.35-3-3-3z" />
      </svg> Add Bed
     </div>
     <div class="form-group"><label class="form-label" for="bed-room">Select Room</label> <select id="bed-room"> <option value="">Choose a room</option> </select>
     </div>
     <div class="form-group"><label class="form-label" for="bed-number">Bed Number</label> <input type="text" id="bed-number" placeholder="Enter bed number">
     </div>
     <div class="checkbox-group"><input type="checkbox" id="bed-occupied"> <label for="bed-occupied">Bed is occupied</label>
     </div><button onclick="addBed()">Add Bed</button>
    </div>
   </div>
   <div class="section-title">
    Hostel Overview
   </div>
   <div class="hostel-display" id="hostel-container">
    <div class="empty-state">
     <svg viewbox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
     </svg>
     <p>No hostels added yet. Start by adding your first hostel above!</p>
    </div>
   </div>
  </main>
  <script>
    // API Configuration
    const API_BASE_URL = 'http://localhost:8080/api';
    
    // Data storage
    let hostels = [];
    let buildings = [];
    let floors = [];
    let rooms = [];
    let beds = [];

    // Default configuration
    const defaultConfig = {
      dashboard_title: "Hostel Management Dashboard",
      welcome_message: "Manage your hostels, buildings, floors, rooms, and beds efficiently"
    };

    // Initialize Element SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          document.getElementById('dashboard-title').textContent = 
            config.dashboard_title || defaultConfig.dashboard_title;
          document.getElementById('welcome-message').textContent = 
            config.welcome_message || defaultConfig.welcome_message;
        },
        mapToCapabilities: (config) => ({
          recolorables: [],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["dashboard_title", config.dashboard_title || defaultConfig.dashboard_title],
          ["welcome_message", config.welcome_message || defaultConfig.welcome_message]
        ])
      });
    }

    // API Helper Functions
    async function apiRequest(endpoint, method = 'GET', data = null) {
      try {
        const options = {
          method,
          headers: {
            'Content-Type': 'application/json',
          },
        };

        if (data) {
          options.body = JSON.stringify(data);
        }

        const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        return await response.json();
      } catch (error) {
        console.error('API request failed:', error);
        showNotification(`API Error: ${error.message}`, 'error');
        throw error;
      }
    }

    // Load all data from API
    async function loadAllData() {
      try {
        showLoading(true);
        
        // Load all data in parallel
        const [hostelData, buildingData, floorData, roomData, bedData] = await Promise.all([
          apiRequest('/hostels'),
          apiRequest('/buildings'),
          apiRequest('/floors'),
          apiRequest('/rooms'),
          apiRequest('/beds')
        ]);

        hostels = hostelData;
        buildings = buildingData;
        floors = floorData;
        rooms = roomData;
        beds = bedData;

        // Build hierarchical structure
        buildHierarchy();
        updateSelects();
        renderHostels();
        
        showLoading(false);
        showNotification('Data loaded successfully!', 'success');
      } catch (error) {
        showLoading(false);
        showNotification('Failed to load data from server', 'error');
      }
    }

    // Build hierarchical data structure
    function buildHierarchy() {
      // Reset arrays
      hostels.forEach(h => h.buildings = []);
      buildings.forEach(b => b.floors = []);
      floors.forEach(f => f.rooms = []);
      rooms.forEach(r => r.beds = []);

      // Build hierarchy
      beds.forEach(bed => {
        const room = rooms.find(r => r.id === bed.roomId);
        if (room) room.beds.push(bed);
      });

      rooms.forEach(room => {
        const floor = floors.find(f => f.id === room.floorId);
        if (floor) floor.rooms.push(room);
      });

      floors.forEach(floor => {
        const building = buildings.find(b => b.id === floor.buildingId);
        if (building) building.floors.push(floor);
      });

      buildings.forEach(building => {
        const hostel = hostels.find(h => h.id === building.hostelId);
        if (hostel) hostel.buildings.push(building);
      });
    }

    // Add Hostel
    async function addHostel() {
      const name = document.getElementById('hostel-name').value.trim();
      const address = document.getElementById('hostel-address').value.trim();
      
      if (!name || !address) {
        showNotification('Please fill in all hostel details', 'error');
        return;
      }

      try {
        showLoading(true);
        const newHostel = await apiRequest('/hostels', 'POST', { name, address });
        
        hostels.push(newHostel);
        document.getElementById('hostel-name').value = '';
        document.getElementById('hostel-address').value = '';
        
        updateSelects();
        renderHostels();
        showLoading(false);
        showNotification('Hostel added successfully!', 'success');
      } catch (error) {
        showLoading(false);
      }
    }

    // Add Building
    async function addBuilding() {
      const hostelId = parseInt(document.getElementById('building-hostel').value);
      const name = document.getElementById('building-name').value.trim();
      
      if (!hostelId || !name) {
        showNotification('Please select a hostel and enter building name', 'error');
        return;
      }

      try {
        showLoading(true);
        const newBuilding = await apiRequest('/buildings', 'POST', { name, hostelId });
        
        buildings.push(newBuilding);
        const hostel = hostels.find(h => h.id === hostelId);
        if (hostel) {
          hostel.buildings.push(newBuilding);
        }

        document.getElementById('building-name').value = '';
        updateSelects();
        renderHostels();
        showLoading(false);
        showNotification('Building added successfully!', 'success');
      } catch (error) {
        showLoading(false);
      }
    }

    // Add Floor
    async function addFloor() {
      const buildingId = parseInt(document.getElementById('floor-building').value);
      const name = document.getElementById('floor-name').value.trim();
      
      if (!buildingId || !name) {
        showNotification('Please select a building and enter floor name', 'error');
        return;
      }

      try {
        showLoading(true);
        const newFloor = await apiRequest('/floors', 'POST', { name, buildingId });
        
        floors.push(newFloor);
        const building = buildings.find(b => b.id === buildingId);
        if (building) {
          building.floors.push(newFloor);
        }

        document.getElementById('floor-name').value = '';
        updateSelects();
        renderHostels();
        showLoading(false);
        showNotification('Floor added successfully!', 'success');
      } catch (error) {
        showLoading(false);
      }
    }

    // Add Room
    async function addRoom() {
      const floorId = parseInt(document.getElementById('room-floor').value);
      const number = document.getElementById('room-number').value.trim();
      const totalBeds = parseInt(document.getElementById('room-total-beds').value);
      
      if (!floorId || !number || !totalBeds || totalBeds < 1) {
        showNotification('Please fill in all room details with valid bed count', 'error');
        return;
      }

      try {
        showLoading(true);
        const newRoom = await apiRequest('/rooms', 'POST', { number, totalBeds, floorId });
        
        rooms.push(newRoom);
        const floor = floors.find(f => f.id === floorId);
        if (floor) {
          floor.rooms.push(newRoom);
        }

        document.getElementById('room-number').value = '';
        document.getElementById('room-total-beds').value = '';
        updateSelects();
        renderHostels();
        showLoading(false);
        showNotification('Room added successfully!', 'success');
      } catch (error) {
        showLoading(false);
      }
    }

    // Add Bed
    async function addBed() {
      const roomId = parseInt(document.getElementById('bed-room').value);
      const number = document.getElementById('bed-number').value.trim();
      const occupied = document.getElementById('bed-occupied').checked;
      
      if (!roomId || !number) {
        showNotification('Please select a room and enter bed number', 'error');
        return;
      }

      const room = rooms.find(r => r.id === roomId);
      if (room && room.beds.length >= room.totalBeds) {
        showNotification('Room has reached maximum bed capacity', 'error');
        return;
      }

      try {
        showLoading(true);
        const newBed = await apiRequest('/beds', 'POST', { number, occupied, roomId });
        
        beds.push(newBed);
        if (room) {
          room.beds.push(newBed);
        }

        document.getElementById('bed-number').value = '';
        document.getElementById('bed-occupied').checked = false;
        renderHostels();
        showLoading(false);
        showNotification('Bed added successfully!', 'success');
      } catch (error) {
        showLoading(false);
      }
    }

    // Toggle bed occupancy
    async function toggleBed(bedId) {
      const bed = beds.find(b => b.id === bedId);
      if (!bed) return;

      try {
        showLoading(true);
        const endpoint = bed.occupied ? `/beds/${bedId}/vacate` : `/beds/${bedId}/occupy`;
        await apiRequest(endpoint, 'PUT');
        
        bed.occupied = !bed.occupied;
        renderHostels();
        showLoading(false);
        showNotification(`Bed ${bed.occupied ? 'occupied' : 'vacated'}`, 'success');
      } catch (error) {
        showLoading(false);
      }
    }

    // Delete bed
    async function deleteBed(bedId) {
      try {
        showLoading(true);
        await apiRequest(`/beds/${bedId}`, 'DELETE');
        
        const bedIndex = beds.findIndex(b => b.id === bedId);
        if (bedIndex > -1) {
          const bed = beds[bedIndex];
          beds.splice(bedIndex, 1);
          
          const room = rooms.find(r => r.id === bed.roomId);
          if (room) {
            const roomBedIndex = room.beds.findIndex(b => b.id === bedId);
            if (roomBedIndex > -1) {
              room.beds.splice(roomBedIndex, 1);
            }
          }
        }
        
        renderHostels();
        showLoading(false);
        showNotification('Bed deleted successfully!', 'success');
      } catch (error) {
        showLoading(false);
      }
    }

    // Delete functions
    async function deleteHostel(hostelId) {
      if (!await showConfirmDialog('Delete Hostel', 'Are you sure you want to delete this hostel? This will also delete all buildings, floors, rooms, and beds associated with it.')) {
        return;
      }

      try {
        showLoading(true);
        await apiRequest(`/hostels/${hostelId}`, 'DELETE');
        
        // Remove from local data
        const hostelIndex = hostels.findIndex(h => h.id === hostelId);
        if (hostelIndex > -1) {
          hostels.splice(hostelIndex, 1);
        }
        
        // Remove associated data
        buildings = buildings.filter(b => b.hostelId !== hostelId);
        floors = floors.filter(f => {
          const building = buildings.find(b => b.id === f.buildingId);
          return building && building.hostelId !== hostelId;
        });
        rooms = rooms.filter(r => {
          const floor = floors.find(f => f.id === r.floorId);
          return floor;
        });
        beds = beds.filter(b => {
          const room = rooms.find(r => r.id === b.roomId);
          return room;
        });
        
        updateSelects();
        renderHostels();
        showLoading(false);
        showNotification('Hostel deleted successfully!', 'success');
      } catch (error) {
        showLoading(false);
      }
    }

    async function deleteBuilding(buildingId) {
      if (!await showConfirmDialog('Delete Building', 'Are you sure you want to delete this building? This will also delete all floors, rooms, and beds in it.')) {
        return;
      }

      try {

      if (!rooms || rooms.length === 0) {

      }

      let html = '';
      rooms.forEach(room => {
        const occupiedBeds = room.beds.filter(b => b.occupied).length;
        const vacantBeds = room.beds.length - occupiedBeds;
        
        html += `
          <div class="room-item">
            <div class="room-header">

                <strong>Room ${room.number}</strong>

    // Show confirmation dialog

      return new Promise((resolve) => {
        const modal = document.createElement('div');
        modal.className = 'confirm-modal';
        modal.innerHTML = `
          <div class="confirm-backdrop">
            <div class="confirm-dialog">
              <h3>${title}</h3>
              <p>${message}</p>
              <div class="confirm-actions">
                <button class="confirm-cancel">Cancel</button>
                <button class="confirm-delete">Delete</button>
              </div>
            </div>
          </div>
        `;

        document.body.appendChild(modal);

        modal.querySelector('.confirm-cancel').onclick = () => {
          modal.remove();
          resolve(false);
        };

        modal.querySelector('.confirm-delete').onclick = () => {
          modal.remove();
          resolve(true);
        };

        modal.querySelector('.confirm-backdrop').onclick = (e) => {
          if (e.target === e.currentTarget) {
            modal.remove();
            resolve(false);
          }
        };
      });
    }
